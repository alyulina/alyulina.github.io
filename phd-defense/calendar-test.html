<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Calendar test</title>
<link rel="stylesheet" type="text/css" href="/css/main.css?v=2">
<style>
  body { background: #fff; }
  .wrap { max-width: 560px; margin: 32px auto; padding: 0 16px; font-family: 'Avenir', 'Avenir Next', 'Helvetica', 'Arial', sans-serif; color: #333; }
  .row { display: flex; align-items: baseline; gap: 12px; margin: 14px 0; }
  .row b { flex: 0 0 1.4em; }
  .row a { font-size: 17px; }
  .row span { color: #888; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <p><b>Temporary page: tap each button on the iPhone and note which ones open "Add to Calendar".</b>
     Each adds a made-up event, "Calendar test", on 1 December; delete it afterwards. Then this page gets removed.</p>
  <div id="rows"></div>
</div>
<script>
  const ics = title => [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//alyulina//calendar-test//EN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT', 'UID:calendar-test-' + Date.now() + '@alyulina.github.io', 'DTSTAMP:20261124T000000Z',
    'DTSTART:20261201T180000Z', 'DTEND:20261201T183000Z', 'SUMMARY:' + title,
    'DESCRIPTION:' + (title.startsWith('К') ? 'Проверка календаря — можно удалить.' : 'A calendar test — fine to delete.'),
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n') + '\r\n';
  const variants = [
    ['A', 'link to a data: URL, with download (what the page does now)', (a, t) => { a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics(t)); a.download = 'test.ics'; }],
    ['B', 'link to a data: URL, no download', (a, t) => { a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics(t)); }],
    ['C', 'link to a blob: URL, with download', (a, t) => { a.href = URL.createObjectURL(new Blob([ics(t)], { type: 'text/calendar;charset=utf-8' })); a.download = 'test.ics'; }],
    ['D', 'link to a blob: URL, no download', (a, t) => { a.href = URL.createObjectURL(new Blob([ics(t)], { type: 'text/calendar;charset=utf-8' })); }],
    ['E', 'tap opens the data: URL from a script', (a, t) => { a.href = '#'; a.onclick = e => { e.preventDefault(); location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics(t)); }; }],
  ];
  const rows = document.getElementById('rows');
  variants.forEach(([key, what, setup]) => {
    [['1', 'Calendar test'], ['2', 'Календарь тест']].forEach(([n, title]) => {
      const row = document.createElement('div'); row.className = 'row';
      const a = document.createElement('a'); a.className = 'note-link'; a.textContent = key + n + (n === '1' ? ' · English' : ' · Russian');
      setup(a, title);
      const s = document.createElement('span'); s.textContent = what;
      row.append(Object.assign(document.createElement('b'), { textContent: key + n }), a, s); rows.append(row);
    });
  });
</script>
</body>
</html>
