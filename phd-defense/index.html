<style>
  /* draft highlight on all text that may still change — delete these two rules to remove every highlight at once */
  .ph { background: #fef2f1; border-radius: 4px; padding: 0 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .ph .ph { background: none; padding: 0; }   /* no double highlight where one sits inside another */

  .lead { margin-bottom: 44px; }

  /* thesis title (not clickable), and a row of pills under it that each open one panel */
  .thesis { margin-bottom: 44px; }
  .thesis h2 { font-size: 24px; line-height: 1.25em; margin: 0 0 12px; }
  /* <button> pills look exactly like the site's link pills */
  .tabs .note-link, #pw, #replay, #skip { border: 0; margin: 0; font-family: 'Avenir', 'Helvetica', 'Arial', 'Sans-Serif'; font-size: 0.9em;
                     line-height: inherit; cursor: url("/img/cursor_pink.png"), auto !important; }
  .tabs, .replay { font-size: 16px; font-family: 'Avenir', 'Helvetica', 'Arial', 'Sans-Serif'; }
  .tabs { display: flex; flex-wrap: wrap; align-items: baseline; row-gap: 0.5em; }   /* room between the rows when the buttons wrap on small screens */
  .tabs .note-link { margin-right: 0.6em; }
  .tabs .note-link[aria-expanded="true"] { background-color: #fef2f1; color: #fa8072; }   /* the open one stays pink, like the current page in the menu */
  .tabs .full-text { font-size: 0.9em; margin-left: 0.2em; white-space: nowrap; }   /* same size as the pills */
  .panel { margin-top: 18px; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* schedule and people, laid out like the news list on the home page */
  .rows { list-style: none; padding-left: 0; margin: 0 0 22px; }
  .rows li { font-size: 16px; line-height: 1.4em; font-family: 'Avenir', 'Helvetica', 'Arial', 'Sans-Serif';
             color: #333; margin-bottom: 0.35em; display: flex; gap: 1em;
             align-items: baseline; }   /* labels line up with the first line of their text, two-line ones included */
  .rows .aside { color: #c1c1c1; }   /* the times after the middle dot, in the same light grey as the labels */
  .rows .note-date { flex: 0 0 8em; font-size: 1em; }   /* a little wider than the longest label, "Join in person"; always the same size as the text beside it */
  .rows .note-date.two-line { line-height: 1.1em; }   /* keeps the two-line label from opening a big gap below it */
  .rows .note-link { margin-left: 0.5em; margin-right: 0; }
  #pw { font-size: 0.9em; margin-left: 0.5em; }   /* same gap as the other pills */
  @media (hover: none) { .note-link:hover { background-color: #f4f4f4; color: #404040; } }   /* on touch screens a tapped button does not stay pink */

  /* the page opens with the animation, sized to fit the window under the menu; once the beads have landed the
     text fades in above them and the animation's box closes up to a strip around the row, with replay below it */
  html { overflow-x: hidden; overflow-x: clip; scrollbar-gutter: stable; }   /* the animation runs the full width of the window; room for a scrollbar is kept from the start, so nothing shifts when the text makes the page scroll */
  .content { padding-bottom: 30px; box-sizing: border-box; }   /* room between the text and the row of beads under it */
  .js .content { display: none; }                   /* (the text is locked: it arrives, unscrambled, once the right page password is in) */
  .beads-wrap { position: relative; width: 100vw; left: 50%; margin-left: -50vw; overflow: hidden; height: 0; }
  .beads { position: absolute; left: 0; bottom: 0; width: 100%; border: 0; display: block;
           pointer-events: none; }   /* the animation ignores the mouse, so the page's own cursor shows over it */
  .replay { margin: 8px 0 0; padding-bottom: 44px; text-align: center; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s .6s; }
  .replay.shown { opacity: 1; visibility: visible; transition: opacity .6s ease; }
  @media (hover: none) { .replay { padding-bottom: 96px; } }   /* phones: clear room under the button, above Safari's toolbar */
  .replay #replay, .replay.resting #skip { display: none; }   /* "skip" while it plays, "replay" once the beads have landed */
  .replay.resting #replay { display: inline; }

  /* the lock: once the beads land, two lines show instead of the text; the right page password brings the text in */
  .gate { display: none; font-size: 16px; font-family: 'Avenir', 'Helvetica', 'Arial', 'Sans-Serif'; padding-bottom: 30px; }
  .gate.shown { display: block; animation: gate-in .6s ease; }
  @keyframes gate-in { from { opacity: 0; } }
  .gate > div + div { margin-top: 0.5em; }   /* a little room between the two lines */
  .gate .note-link, .no-js .note-link { margin-right: 0; }
  .gate-label { color: #333; margin-left: 0.5em; }
  #unlock { border: 0; margin: 0; font-family: 'Avenir', 'Helvetica', 'Arial', 'Sans-Serif'; font-size: 0.9em; line-height: inherit; cursor: url("/img/cursor_pink.png"), auto !important; }
  #unlock[hidden], #unlock-form[hidden] { display: none; }
  #unlock-form { display: inline; }
  /* the password field is drawn like the site's pills (.note-link in main.css), and grows with what is typed */
  #unlock-form input { font-family: 'Avenir', 'Helvetica', 'Arial', 'Sans-Serif'; font-size: 0.9em; line-height: inherit; vertical-align: 0.05em;
                       width: 7em; padding: 1px 4px; box-sizing: content-box; margin: 0; border: 0; border-radius: 4px; background: #f4f4f4; color: #404040; outline: none; }
  #unlock-form input::placeholder { color: #404040; opacity: 1; }
  #unlock-form input:hover, #unlock-form input:focus { background: #fef2f1; color: #fa8072; }
  #unlock-form input:hover::placeholder, #unlock-form input:focus::placeholder { color: #fa8072; }
  #unlock-form.wrong input { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  /* without JavaScript: a way to ask for the details, and the row of beads as a still picture */
  .no-js { font-size: 16px; font-family: 'Avenir', 'Helvetica', 'Arial', 'Sans-Serif'; color: #333; }
  .beads-still { display: block; margin: 30px auto 44px; max-width: 100%; height: auto; }

  @media only screen and (max-width: 1024px) {
    .thesis h2 { font-size: 22px; }
    .rows li { font-size: 18px; line-height: 1.65em; }   /* more room between wrapped lines (and the buttons in them) */
    .tabs, .replay, .gate, .no-js { font-size: 18px; }
  }
  @media only screen and (max-width: 560px) {
    .rows li { flex-direction: column; gap: 0.3em; margin-bottom: 1em; line-height: 1.5em; }   /* a little room under each label, wrapped lines a bit tighter */
    .rows .note-date { flex: none; }
    .rows .note-date.two-line { line-height: inherit; }   /* labels sit above the text here, so two-line ones fit on one line */
    .rows .note-date.two-line br { display: none; }
  }

<script>
  // the locked text: only this scrambled block is in the page; the page password unscrambles it in the browser
  // (PBKDF2-SHA256 → AES-256-CTR, sealed with HMAC-SHA256; written by _scripts/lock_defense.py, which must use the same settings)
  const LOCKED = 'L97MOARiAVUrLZFejlxgbQ==.5pkKbne45rwAAAAAAAAAAA==.TrTxREiSxk21UV21z0pZfXjoKWFY/WY9sKFPX2y2CFlHK/Zf0G2J7lhlehbbnrLSobIVlyOuTeiPiotgVICJaX/YQY/ERXQtaLa29QV9qJlMtSOG6P91xBzpaw9vmx0qZbKda8nMwWor1ksddEkPxGLcuDJACjuFxDUQ2/CYqos/DX8mWoApTxlju8P1rbh+zJaXDoWNzGsNIWZTy4aqHu8KdcNk+ZXKa29R9mNoGXcVAtDwo0PIPqzjJc9SSDS69NJyKn/Y+HRiVv5034uq4iE7blR/Nfv8Ha4tLUt53WfXxG+vbdfSXjY8x/tv+yBuQvXT9hdKSXJQUKiZtdDW00l1h8SzxkNFwLmOol8ywqo2J9AhrU5zuwC8PpfDn39QOiYbczYnr882p9+HIbT8EcfL9SoH9X1qPptGBVRquhNqM9kZk1dGv8+dQH3bSunZ6DfFsqTzg6kYRdD8K0KOKsYLkpc+TCuNIvDyhK9CesM+0NZWp97mDWMYyX7xuRyWSr7Sqimz2XLlzW/eg8crNwuORZfWH0SF+j3iv5GN/EFnNmcILQAokpIxsuQgoPADUZzB1ePOVJWNdPXRz5h7B5kyI4BL9TUfWRFOQPefk9umDq6zgoM+UVIRBcFZo2CcBDS9fP35qVlCZ4I4Lcty+5Bv++YZuwszhX2gZCFnqrVRXM+8E+uzU4UhREkXRGNe9GzmruA9jvhX8KCOcuUMVpxnxOGI/eF5vGIrPzeQSnA46GOXIz+g8eqexv1IJOmWXmPmvNcYkmuBYbJqaK1xfDiq9nzm2HuypTovX9HQP96gNDn/vA4UM/AGJ+9eFByVcG49t9l8whl5pDqZOOjwfXnuHt031m4utDoF9u31sFBHOd6QVdrSOddi0dYJQ9n91WiXho7TLR4/t2pivww7csmw7pkjuiQiTGhdK+lnq5wubb6Kxa8f6pp7b0gO6NexOdyCogDCn9lBxb70xVKSRBJGQnRahm3pL+H1H7QwTQ4eMHBncrJa5Es13sfIfCMcRtSrHgVynpA+gGVoJ3c374fw4O8Hfu2Vd77QiYFU83vrRnENXqUCH1mSaVcoAuUoNlt+zZzmjSIXtsHc0o7SkwQfh4dC0Dso9vETvcQevytwFc+PfVPAIdEfB8hFfPLTD8+hWU6JuNYd77e7Cb6DD4bgrf4dNGopRXSfM9CQMdx+OgKic1WjBJKfTMRX9YXuVYX/UNQYkknNB3E9Hc4QLcaDJZp9steqpUodiMPzdJUBDUr2raZCPl7I0Qy/JjjxdWSBGWD8ooKgkV4fQ9ugBiOkDKN8qp0QmIG4KaFM13D87+tr7Af7r3svZ6yfdDgC5+BNIvevTcyI6sj2aclzKzjaqTHTk9bTCoCrkPpQHkly8RhJPox/pFyJUQmSA2RCvAxV9/lIIkZ4rhyXaOk5GplIbCy0yCLM0Jz5xgtz1rPvOzdeQG3b88tD47W+866Z8oImKITC3eQRJ5SbBVG8dvP1NIjdnyzsszOMYfErNzo4xhiUD9ELszjNOUYlZpMIiZ6GBAd1vmys65DTrWabnag8OYiUCobPOgYNEWOi3VerpsIyKvK3GRn1v7I5LUkqbnthcfLWe2Vj5w13LCXeoXjgaNLgz0AtAzC0+ZV+zQ6AlAtUuzKh4BnX99gkRKB/aBUL4z0surzinnjNsJITeXaTSSGeFGkTh0j6EhRmdqrBUT5oVb8R5MYQco4nUZfC1ZAKxNESPYCsnSHMaSbSw4ikWUDJEdF0wo1HjbNa9FAqTFfs05hEd0SArA2shoVYyrkclGT7erKkHK4/32bjauYLiKzbGtV6tY6RlMhPNPXIr/P44V6zuJiH1fwvkDNDe5GmYrEPnhe/bYro+GzNu4GJE4+WKWN3vzrE7ZwnL6C0VC/JMMT1WnJHx13OcA0IR0U1asW7KZo0pkbcEXzjgEKZx31XO2BG0ftS3w/QynhLY8UTVPVIWIqaraz9V9ySzN8/p7DppdZYwZ3KQrf35m2ykjpDyOzFKeJtu9UXB3PoKUkk2ppbO2EhPzgatRpP7iOgnJvGfVF+efjMh47n43urFjG2UtZ/F86ybx98qKlcweuQuOVqCM4NEq8ATjROkUcEYmcyC8L68FhHhBKu79tAdX2+EtUJMpkiP9RIPO7ANBP3eWHdLfk9wS8TkgZOumby1vtPXYlfGXGyd39NTzov9Yq13LgCf3N5H1Yo7AcI7lYJoMNZyw==.neH8apUT3BxKeTCGiFmQtkGFcZaXNgg8TTADAi/HAAY=';
  let unlocked = false;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function openLocked(password) {
    const [salt, iv, data, tag] = LOCKED.split('.').map(b64);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const keys = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, base, 512));
    const macKey = await crypto.subtle.importKey('raw', keys.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const sealed = new Uint8Array(iv.length + data.length); sealed.set(iv); sealed.set(data, iv.length);
    if (!(await crypto.subtle.verify('HMAC', macKey, tag, sealed))) throw new Error('wrong password');
    const encKey = await crypto.subtle.importKey('raw', keys.slice(0, 32), 'AES-CTR', false, ['decrypt']);
    const packed = await crypto.subtle.decrypt({ name: 'AES-CTR', counter: iv, length: 64 }, encKey, data);
    return new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }
  const gate = document.querySelector('.gate'), unlockBtn = document.getElementById('unlock'),
        form = document.getElementById('unlock-form'), input = form.querySelector('input');
  const tryPassword = async p => {
    try { document.querySelector('.content').innerHTML = await openLocked(p); } catch { return false; }
    wire(); unlocked = true;
    try { localStorage.setItem('defense-pw', p); } catch {}   // returning guests go straight in
    return true;
  };
  const showGate = () => gate.classList.add('shown');
  // the field grows with what is typed (and fits its placeholder when empty), measured with a hidden copy in the same font
  const sizer = document.createElement('span');
  Object.assign(sizer.style, { position: 'absolute', visibility: 'hidden', whiteSpace: 'pre', fontFamily: getComputedStyle(input).fontFamily, fontSize: '0.9em' });
  form.appendChild(sizer);
  const fit = () => { sizer.textContent = input.value ? '\u2022'.repeat(input.value.length) : input.placeholder; input.style.width = (sizer.offsetWidth + 14) + 'px'; };
  input.addEventListener('input', fit);
  unlockBtn.onclick = () => { unlockBtn.hidden = true; form.hidden = false; fit(); input.focus(); };
  form.onsubmit = async e => {
    e.preventDefault(); form.classList.remove('wrong');
    if (await tryPassword(input.value)) { gate.classList.remove('shown'); showText(); }
    else { form.offsetWidth; form.classList.add('wrong'); input.select(); }
  };
  input.onblur = () => { if (!input.value) { form.hidden = true; unlockBtn.hidden = false; } };
  try { const saved = localStorage.getItem('defense-pw'); if (saved) tryPassword(saved); } catch {}

  // the buttons inside the text, wired up once it is there
  function wire() {
  // abstract / chapter pills: each opens its panel; only one open at a time, click again to close
  const tabs = [...document.querySelectorAll('.tabs .note-link')];
  tabs.forEach(t => t.onclick = e => {
    e.preventDefault();
    const open = t.getAttribute('aria-expanded') !== 'true';
    tabs.forEach(o => { o.setAttribute('aria-expanded', 'false'); document.getElementById(o.getAttribute('aria-controls')).hidden = true; });
    if (open) { t.setAttribute('aria-expanded', 'true'); document.getElementById(t.getAttribute('aria-controls')).hidden = false; }
  });

  // password pill: click to show the password (and copy it); click again to hide it
  const pw = document.getElementById('pw');
  pw.onclick = e => {
    e.preventDefault();
    if (pw.dataset.shown) { pw.textContent = 'password'; delete pw.dataset.shown; return; }
    pw.textContent = pw.dataset.pw; pw.dataset.shown = '1';
    if (navigator.clipboard) navigator.clipboard.writeText(pw.dataset.pw).catch(() => {});
  };

  // "add to calendar": the calendar file is made here from the block at the end of the text
  const icsData = document.getElementById('ics-data'), ics = document.getElementById('ics');
  if (icsData && ics) ics.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsData.textContent.trim().replace(/\r?\n/g, '\r\n') + '\r\n');
  }

  // the animation: sized to fit the window under the menu (never taller than 560px or wider than the screen allows),
  // then, once the beads have landed, the text fades in above it while its box closes up to a strip around the row
  const wrap = document.querySelector('.beads-wrap'), frame = wrap.querySelector('iframe'), content = document.querySelector('.content');
  const replayRow = document.querySelector('.replay'), EASE = '.9s ease';
  const trim = Math.min(40, innerWidth * 0.0643);   // the empty band at the top of the frame, left out of view
  const room = wrap.getBoundingClientRect().top + scrollY + replayRow.offsetHeight + 64;   // menu above; skip/replay, and room under it, below
  const frameH = Math.round(Math.max(260, Math.min(560, innerWidth * 0.9, innerHeight - room + trim)));
  frame.style.height = frame.style.maxHeight = frameH + 'px';   // (max-height too: iPhone Safari may otherwise stretch the frame)
  wrap.style.height = (frameH - trim) + 'px';
  // where the screen is taller than the animation needs (phones), centre it in the space under the menu
  const spare = innerHeight - replayRow.getBoundingClientRect().bottom - 48;   // (measured with everything in place; keeps room under skip)
  if (spare > 0) wrap.style.marginTop = Math.round(spare / 2) + 'px';
  frame.src = frame.dataset.src;
  let revealed = false;
  const showText = () => {   // the text grows in from nothing above the beads
    content.style.display = 'block';
    const h = content.scrollHeight;
    const pad = getComputedStyle(content).paddingBottom;
    Object.assign(content.style, { height: '0px', paddingBottom: '0px', opacity: '0', overflow: 'hidden' });
    content.offsetHeight;   // start the transition from here (padding too, or it would show at once and make the beads jump)
    Object.assign(content.style, { transition: `height ${EASE}, padding-bottom ${EASE}, opacity ${EASE}`, height: h + 'px', paddingBottom: pad, opacity: '1' });
    content.addEventListener('transitionend', e => { if (e.propertyName === 'height') Object.assign(content.style, { height: '', paddingBottom: '', overflow: '', transition: '' }); });
  };
  const reveal = () => { revealed = true; if (unlocked) showText(); else showGate(); };   // once the beads land: the text if unlocked, else the two lines
  const closeUp = (d, anim) => {
    const r = d.r || 10, floor = isFinite(d.floorY) ? d.floorY : frameH - 20;
    const under = Math.max(0, Math.round(frameH - floor - 4));   // the frame's empty band under the line, left out of view
    const strip = Math.round(2 * r + 3.2 * r + 10);              // the row, plus room for a hop over a neighbour
    wrap.style.transition = anim ? `height ${EASE}, margin-top ${EASE}` : '';
    frame.style.transition = anim ? `bottom ${EASE}` : '';
    frame.style.bottom = -under + 'px';
    wrap.style.marginTop = '0px';   // the text takes that space now
    wrap.style.height = strip + 'px';
    if (!revealed) reveal();
  };
  addEventListener('message', e => {
    // once every bead is down: bring the text in and close the box up around the row, with room above it for
    // the last bounces and hops, while they finish rolling into place
    if (e.data && e.data.type === 'beads:landed') {   // and "replay" right away, without waiting for them to settle
      closeUp(e.data, true);
      replayRow.classList.add('resting', 'shown');
      document.getElementById('replay').textContent = 'replay';
    }
    if (e.data && e.data.type === 'beads:rest') {   // all still (or a still for reduced motion: then "play")
      closeUp(e.data, revealed || !e.data.still);
      replayRow.classList.add('resting', 'shown');
      document.getElementById('replay').textContent = e.data.still ? 'play' : 'replay';   // "play" when motion is reduced and it has not played yet
    }
    if (e.data === 'beads:start') {   // "skip" only the first time, while the text is still hidden; nothing during a replay
      replayRow.classList.remove('resting');
      replayRow.classList.toggle('shown', !revealed);
    }
  });
  document.getElementById('skip').onclick = e => {   // straight to the beads resting in their row, and the text
    e.preventDefault();
    const w = frame.contentWindow;
    if (w.settleNow) w.settleNow();
  };
  document.getElementById('replay').onclick = e => {
    e.preventDefault();
    const w = frame.contentWindow;
    if (!w.build && !w.playOnce) return;
    // open the box again under the text, and play; the space it will take is held from the start (as a margin that
    // shrinks while the box grows), so the page can scroll straight to it
    const open = frameH - trim, now = wrap.getBoundingClientRect().height;
    wrap.style.transition = 'none';
    wrap.style.marginBottom = Math.max(0, open - now) + 'px';
    wrap.offsetHeight;
    wrap.style.transition = `height ${EASE}, margin-bottom ${EASE}`;
    wrap.style.height = open + 'px';
    wrap.style.marginBottom = '0px';
    frame.style.transition = `bottom ${EASE}`; frame.style.bottom = '0px';
    if (w.playOnce) w.playOnce(); else w.build();   // (playOnce also wakes it up if it was showing a still for reduced motion)
    // bring the whole opened box into view right away (worked out from the size it is opening to)
    const below = wrap.getBoundingClientRect().top + (frameH - trim) + 16 - innerHeight;
    if (below > 0) scrollTo({ top: scrollY + Math.min(below, wrap.getBoundingClientRect().top), behavior: 'smooth' });
  };
</script>
</body>
</html>
