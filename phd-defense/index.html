  };
  const langSwitch = document.querySelector('.lang-switch');
  const showGate = () => { gate.classList.add('shown'); langSwitch.classList.add('shown'); };
  // the field grows with what is typed (and fits its placeholder when empty), measured with a hidden copy in the same font
  const sizer = document.createElement('span');
  Object.assign(sizer.style, { position: 'absolute', visibility: 'hidden', whiteSpace: 'pre', fontFamily: getComputedStyle(input).fontFamily });
  form.appendChild(sizer);
  const fit = () => { sizer.style.fontSize = getComputedStyle(input).fontSize; sizer.textContent = input.value ? '\u2022'.repeat(input.value.length) : input.placeholder; input.style.width = (sizer.offsetWidth + (input.value ? 6 : 1)) + 'px'; };   // (a little room for the cursor once typing)
  input.addEventListener('input', fit);
  unlockBtn.onclick = () => { unlockBtn.hidden = true; form.hidden = false; fit(); input.focus(); };
  form.onsubmit = async e => {
    e.preventDefault(); form.classList.remove('wrong');
    if (await tryPassword(input.value)) { gate.classList.remove('shown'); showText(); }
    else { form.offsetWidth; form.classList.add('wrong'); input.select(); }
  };
  input.onblur = () => { if (!input.value) { form.hidden = true; unlockBtn.hidden = false; } };
  try { localStorage.removeItem('defense-pw'); } catch {}   // an older version kept it for good: forget that copy
  try { const saved = sessionStorage.getItem('defense-pw'); if (saved) tryPassword(saved); } catch {}

  // the buttons inside the text, wired up once it is there
  function wire() {
  // abstract / chapter pills: each opens its panel; only one open at a time (in each language), click again to close
  document.querySelectorAll('.content .tabs').forEach(group => {
    const tabs = [...group.querySelectorAll('.note-link[aria-controls]')];
    tabs.forEach(t => t.onclick = e => {
      e.preventDefault();
      const open = t.getAttribute('aria-expanded') !== 'true';
      tabs.forEach(o => { o.setAttribute('aria-expanded', 'false'); document.getElementById(o.getAttribute('aria-controls')).hidden = true; });
      if (open) { t.setAttribute('aria-expanded', 'true'); document.getElementById(t.getAttribute('aria-controls')).hidden = false; }
    });
  });

  // password pills: click to show the password (and copy it); click again to hide it
  document.querySelectorAll('.content .pw').forEach(pw => {
    const label = pw.textContent;
    pw.onclick = e => {
      e.preventDefault();
      if (pw.dataset.shown) { pw.textContent = label; delete pw.dataset.shown; return; }
      pw.textContent = pw.dataset.pw; pw.dataset.shown = '1';
      if (navigator.clipboard) navigator.clipboard.writeText(pw.dataset.pw).catch(() => {});
    };
  });

  // "add to calendar": the calendar file is made here from the block at the end of the text
  // calendar lines may be at most 75 bytes; longer ones continue on the next line after a space (Russian letters are 2 bytes each,
  // and iPhone Safari silently refuses a file that breaks this)
  const fold = line => {
    const out = []; let cur = '', bytes = 0;
    for (const ch of line) {
      const b = new TextEncoder().encode(ch).length;
      if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur);
    return out.join('\r\n ');
  };
  // handed over as a blob: link with a file name; iPhone Safari ignores a data: link here (tested on a phone: blob works, data does not)
  const icsFile = el => URL.createObjectURL(new Blob([el.textContent.trim().split(/\r?\n/).map(fold).join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' }));
  const icsEn = document.getElementById('ics-data'), icsRu = document.getElementById('ics-data-ru') || icsEn;
  // on Android the same pill opens Google Calendar with the event filled in instead (the Google Calendar app cannot open
  // calendar files); built from the same calendar block, with the times in its own time zone
  const googleLink = el => {
    const event = el.textContent.replace(/\r?\n[ \t]/g, '').split(/BEGIN:VEVENT/)[1].split(/END:VEVENT/)[0];   // the event itself, not the time zone rules
    const f = {}; event.split(/\r?\n/).forEach(line => {
      const m = line.match(/^([A-Z-]+)((?:;[^:]*)?):(.*)$/); if (m && !(m[1] in f)) f[m[1]] = { params: m[2], value: m[3] };
    });
    const text = s => (s || '').replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1');
    const tz = ((f.DTSTART && f.DTSTART.params) || '').match(/TZID=([^;:]+)/);
    const q = new URLSearchParams({ action: 'TEMPLATE', text: text(f.SUMMARY && f.SUMMARY.value), dates: f.DTSTART.value + '/' + f.DTEND.value,
      location: text(f.LOCATION && f.LOCATION.value), details: text(f.DESCRIPTION && f.DESCRIPTION.value) });
    if (tz) q.set('ctz', tz[1]);
    return 'https://calendar.google.com/calendar/render?' + q;
  };
  const android = /Android/i.test(navigator.userAgent);
  const setCalendar = (sel, el) => document.querySelectorAll(sel).forEach(a => {
    if (android) { a.href = googleLink(el); a.removeAttribute('download'); a.target = '_blank'; } else a.href = icsFile(el);
  });
  if (icsEn) setCalendar('.content .lang-en .ics', icsEn);
  if (icsRu) setCalendar('.content .lang-ru .ics', icsRu);
  setLang(lang);
  }

  // по-русски (pink while chosen; click again for English): swaps the text (both languages are in the locked block) and the two public lines; not remembered, so the page always opens in English
  let lang = 'en', replayStill = false;
  const setReplayLabel = () => { document.getElementById('replay').textContent = lang === 'ru' ? (replayStill ? 'посмотреть' : 'ещё раз') : (replayStill ? 'play' : 'replay'); };
  try { localStorage.removeItem('defense-lang'); } catch {}   // the page always opens in English (and forgets any choice an older version saved)
  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.title = l === 'ru' ? 'Анастасия Люлина | Защита диссертации' : 'Anastasia Lyulina | PhD Defense';
    const btn = document.getElementById('lang');
    btn.setAttribute('aria-pressed', l === 'ru');   // always "по-русски": pink while chosen, click again for English
    document.querySelectorAll('[data-ru]').forEach(el => { if (!el.dataset.en) el.dataset.en = el.textContent; el.textContent = l === 'ru' ? el.dataset.ru : el.dataset.en; });
    document.querySelectorAll('[data-ru-placeholder]').forEach(el => { if (!el.dataset.enPlaceholder) el.dataset.enPlaceholder = el.placeholder; el.placeholder = l === 'ru' ? el.dataset.ruPlaceholder : el.dataset.enPlaceholder; });
    // what screen readers say (field label, animation description) follows the language too
    [['ruLabel', 'aria-label'], ['ruTitle', 'title']].forEach(([key, attr]) => document.querySelectorAll(`[data-${key === 'ruLabel' ? 'ru-label' : 'ru-title'}]`).forEach(el => {
      const enKey = key + 'En'; if (!el.dataset[enKey]) el.dataset[enKey] = el.getAttribute(attr);
      el.setAttribute(attr, l === 'ru' ? el.dataset[key] : el.dataset[enKey]);
    }));
    // the email subject
    document.querySelectorAll('.gate a[href^="mailto:"]').forEach(a => a.href = 'mailto:alyulina@stanford.edu?subject=' + encodeURIComponent(l === 'ru' ? 'Защита диссертации' : 'PhD defense'));
    document.querySelectorAll('.content .lang-en').forEach(el => el.hidden = l === 'ru');
    document.querySelectorAll('.content .lang-ru').forEach(el => el.hidden = l !== 'ru');
    setReplayLabel();
    if (!form.hidden) fit();
  }
  document.getElementById('lang').onclick = () => setLang(lang === 'ru' ? 'en' : 'ru');
  setLang(lang);

  // the animation: sized to fit the window under the menu (never taller than 560px or wider than the screen allows),
  // then, once the beads have landed, the text fades in above it while its box closes up to a strip around the row
  const wrap = document.querySelector('.beads-wrap'), frame = wrap.querySelector('iframe'), content = document.querySelector('.content');
  const replayRow = document.querySelector('.replay'), EASE = '.9s ease';
  const trim = Math.min(40, innerWidth * 0.0643);   // the empty band at the top of the frame, left out of view
  const room = wrap.getBoundingClientRect().top + scrollY + replayRow.offsetHeight + 64;   // menu above; skip/replay, and room under it, below
  const frameH = Math.round(Math.max(260, Math.min(560, innerWidth * 0.9, innerHeight - room + trim)));
  frame.style.height = frame.style.maxHeight = frameH + 'px';   // (max-height too: iPhone Safari may otherwise stretch the frame)
  wrap.style.height = (frameH - trim) + 'px';
  // where the screen is taller than the animation needs (phones), centre it in the space under the menu
  const spare = innerHeight - replayRow.getBoundingClientRect().bottom - 48;   // (measured with everything in place; keeps room under skip)
  if (spare > 0) wrap.style.marginTop = Math.round(spare / 2) + 'px';
  frame.src = frame.dataset.src;
  let revealed = false;
  const showText = () => {   // the text grows in from nothing above the beads
    langSwitch.classList.add('shown');
    content.style.display = 'block';
    const h = content.scrollHeight;
    const pad = getComputedStyle(content).paddingBottom;
    Object.assign(content.style, { height: '0px', paddingBottom: '0px', opacity: '0', overflow: 'hidden' });
    content.offsetHeight;   // start the transition from here (padding too, or it would show at once and make the beads jump)
    Object.assign(content.style, { transition: `height ${EASE}, padding-bottom ${EASE}, opacity ${EASE}`, height: h + 'px', paddingBottom: pad, opacity: '1' });
    content.addEventListener('transitionend', e => { if (e.propertyName === 'height') Object.assign(content.style, { height: '', paddingBottom: '', overflow: '', transition: '' }); });
  };
  const reveal = () => { revealed = true; if (unlocked) showText(); else showGate(); };   // once the beads land: the text if unlocked, else the two lines
  const closeUp = (d, anim) => {
    const r = d.r || 10, floor = isFinite(d.floorY) ? d.floorY : frameH - 20;
    const under = Math.max(0, Math.round(frameH - floor - 4));   // the frame's empty band under the line, left out of view
    const strip = Math.round(2 * r + 3.2 * r + 10);              // the row, plus room for a hop over a neighbour
    wrap.style.transition = anim ? `height ${EASE}, margin-top ${EASE}` : '';
    frame.style.transition = anim ? `bottom ${EASE}` : '';
    frame.style.bottom = -under + 'px';
    wrap.style.marginTop = '0px';   // the text takes that space now
    wrap.style.height = strip + 'px';
    if (!revealed) reveal();
  };
  addEventListener('message', e => {
    // once every bead is down: bring the text in and close the box up around the row, with room above it for
    // the last bounces and hops, while they finish rolling into place
    if (e.data && e.data.type === 'beads:landed') {   // and "replay" right away, without waiting for them to settle
      closeUp(e.data, true);
      replayRow.classList.add('resting', 'shown');
      replayStill = false; setReplayLabel();
    }
    if (e.data && e.data.type === 'beads:rest') {   // all still (or a still for reduced motion: then "play")
      closeUp(e.data, revealed || !e.data.still);
      replayRow.classList.add('resting', 'shown');
      replayStill = !!e.data.still; setReplayLabel();   // "play" (посмотреть) when motion is reduced and it has not played yet, else "replay" (ещё раз)
    }
    if (e.data === 'beads:start') {   // "skip" only the first time, while the text is still hidden; nothing during a replay
      if (!revealed) replayRow.classList.remove('resting');   // (on a replay the row keeps its button while it fades out, so "skip" never flashes)
      replayRow.classList.toggle('shown', !revealed);
    }
  });
  document.getElementById('skip').onclick = e => {   // straight to the beads resting in their row, and the text
    e.preventDefault();
    const w = frame.contentWindow;
    if (w.settleNow) w.settleNow();
  };
  let replaying = false;
  addEventListener('message', e => { if (e.data && (e.data.type === 'beads:landed' || e.data.type === 'beads:rest')) replaying = false; });
  document.getElementById('replay').onclick = e => {
    e.preventDefault();
    const w = frame.contentWindow;
    if ((!w.build && !w.playOnce) || replaying) return;
    replaying = true;
    // the button fades out first, and only then does the box open (and the page scroll), so it is already going when things move
    replayRow.classList.remove('shown');
    setTimeout(() => replayNow(w), 300);
  };
  const replayNow = w => {
    // open the box again under the text, and play; the space it will take is held from the start (as a margin that
    // shrinks while the box grows), so the page can scroll straight to it
    const open = frameH - trim, now = wrap.getBoundingClientRect().height;
    wrap.style.transition = 'none';
    wrap.style.marginBottom = Math.max(0, open - now) + 'px';
    wrap.offsetHeight;
    wrap.style.transition = `height ${EASE}, margin-bottom ${EASE}`;
    wrap.style.height = open + 'px';
    wrap.style.marginBottom = '0px';
    frame.style.transition = `bottom ${EASE}`; frame.style.bottom = '0px';
    if (w.playOnce) w.playOnce(); else w.build();   // (playOnce also wakes it up if it was showing a still for reduced motion)
    // bring the whole opened box into view right away (worked out from the size it is opening to)
    const below = wrap.getBoundingClientRect().top + (frameH - trim) + 16 - innerHeight;
    if (below > 0) scrollTo({ top: scrollY + Math.min(below, wrap.getBoundingClientRect().top), behavior: 'smooth' });
  };
</script>
</body>
</html>
