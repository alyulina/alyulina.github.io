---
layout: default
title: Publications
---
<div class="publications">

	<style>
		.publications li { margin-bottom: 1em; }
		.pub-journal { font-family: 'Albra', 'Tiempos', 'Times New Roman', 'Serif'; font-style: italic; }
		.pub-abstract { font-size: 0.9em; color: #555; margin-top: 0.4em; }
		.note-link.on { background-color: #fbefea; color: #d97757; }
		button.note-link { border: 0; font-family: inherit; line-height: normal; cursor: var(--cursor-link) !important; }
		/* the "contributed equally" note: pinned to the bottom of the window while the list scrolls under it (same screens as the pinned header).
		   While pinned, the white above its line mirrors the one under the pinned menu (as much plain white, then the same fade: the script below
		   reads them from the header); it sits a little above the window's edge, and settles into its own place under the last paper at the end. */
		@media only screen and (min-width: 700px) and (min-height: 600px) {
			html { overflow-x: clip; }   /* (the white band runs the full width of the window without making the page scroll sideways) */
			.pub-footnote { position: sticky; bottom: 14px; z-index: 5; margin-top: -45px; padding-top: 45px; display: flow-root; --fade: 0px; }   /* (flow-root keeps the note's own space below it inside the white band) */
			.pub-footnote::before { content: ''; position: absolute; z-index: -1; pointer-events: none; top: var(--top, 8px); bottom: -14px;
			                        left: 50%; width: 100vw; transform: translateX(-50%);
			                        background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.45) calc(var(--fade) * .3),
			                                                    rgba(255,255,255,.85) calc(var(--fade) * .6), #fff var(--fade)); }   /* (the fade, then plain white down to the line) */
		}
	</style>

<div id="publishedSection" style="display:none">
	<h2><strong>Published manuscripts</strong></h2>
	<ol id="pubList" reversed style="padding-left:1.2em; margin-bottom: 1.2em; margin-top: 1.2em;"></ol>
	<br>
</div>

<div id="submittedSection" style="display:none">
	<h2><strong>Submitted manuscripts</strong></h2>
	<ol id="subList" reversed style="list-style-type:none; padding-left:1.2em; margin-bottom: 1.2em; margin-top: 1.2em;"></ol>
	<br>
</div>

<div id="preparationSection" style="display:none">
	<h2><strong>Manuscripts in preparation</strong></h2>
	<ol id="prepList" reversed style="list-style-type:none; padding-left:1.2em; margin-bottom: 1.2em; margin-top: 1.2em;"></ol>
	<br>
</div>

<!-- Plain list for browsers without JavaScript, built by Jekyll from the same data. -->
<noscript>
{%- assign statuses = "published,review,preparation" | split: "," -%}
{%- assign headings = "Published manuscripts,Submitted manuscripts,Manuscripts in preparation" | split: "," -%}
{%- capture bold_name %}<strong>{{ site.publication_name }}</strong>{% endcapture -%}
{%- for status in statuses -%}
	{%- assign papers = site.data.publications | where: "status", status -%}
	{%- if status == "published" -%}{%- assign papers = papers | sort: "year" | reverse -%}{%- endif -%}
	{%- if papers.size > 0 %}
	<h2><strong>{{ headings[forloop.index0] }}</strong></h2>
	<ol reversed style="padding-left:1.2em; margin-bottom: 1.2em; margin-top: 1.2em;">
	{%- for p in papers %}
		{%- assign authors_html = p.authors | replace: "**", "@@" | replace: "*", "<sup>*</sup>" | replace: "@@", "<sup>**</sup>" -%}
		{%- if site.publication_name != "" and site.publication_name -%}{%- assign authors_html = authors_html | replace: site.publication_name, bold_name -%}{%- endif %}
		<li><p>{{ authors_html }}. <em>{{ p.title }}</em>{% if p.journal != "" and p.journal %}. <span class="pub-journal">{{ p.journal }}</span>{% if p.volume != "" and p.volume %} {{ p.volume }}{% endif %}{% if p.pages != "" and p.pages %}, {{ p.pages }}{% endif %}{% endif %}{% if p.year != "" and p.year %} ({{ p.year }}).{% else %}.{% endif %}<span class="nl-gap"></span> <span class="notes-group">
			{%- if p.paper != "" and p.paper %}<a class="note-link" href="{{ p.paper }}" target="_blank">{% if status == "review" %}preprint{% else %}paper{% endif %}</a>{% endif -%}
			{%- if p.code != "" and p.code %}<a class="note-link" href="{{ p.code }}" target="_blank">code</a>{% endif -%}
			{%- if p.cover != "" and p.cover %}<a class="note-link" href="{{ p.cover }}" target="_blank">cover</a>{% endif -%}
			{%- if p.commentary != "" and p.commentary %}<a class="note-link" href="{{ p.commentary }}" target="_blank">commentary</a>{% endif -%}
			{%- if p.news != "" and p.news %}<a class="note-link" href="{{ p.news }}" target="_blank">news</a>{% endif -%}
		</span></p></li>
	{%- endfor %}
	</ol>
	<br>
	{%- endif -%}
{%- endfor %}
</noscript>

<!--
<p style="font-family:'Albra', 'Tiempos', 'Times New Roman', 'Serif'; "><em>See citations for publications <a href="https://scholar.google.com/citations?hl=en&user=wSbesjsAAAAJ" target="_blank">here</a>.</em></p>
-->
<div class="pub-footnote">   <!-- stays at the bottom of the window while the list is longer than it (not on phones), then settles here under the last paper -->
<hr style="width:25%" align="left">
<p class="footnote"><sup>*</sup> These authors contributed equally.</p>
</div>
<div class="pub-footnote-end"></div>   <!-- marks where the note's own place ends -->
<script>
  // the white band above the pinned note mirrors the one under the pinned menu: same height (from the menu's text to the header's bottom)
  // and the same fade. Near its own place under the last paper it eases back to the page's usual 45px gap, so the last paper is never dimmed.
  (function () {
    var note = document.querySelector('.pub-footnote'), end = document.querySelector('.pub-footnote-end'),
        header = document.querySelector('.site-header'), link = header && header.querySelector('nav a');
    if (!note || !end || !link) return;
    var update = function () {
      var band = header.getBoundingClientRect().bottom - link.getBoundingClientRect().bottom;
      var fade = parseFloat(getComputedStyle(header).getPropertyValue('--fade')) || 0;
      var away = end.getBoundingClientRect().top - (innerHeight - 14);           // how far the note still is from its own place
      var t = Math.max(0, Math.min(1, away / 30));
      // the fade always stays; near the end the plain white part shrinks instead, so that at the end white and fade together fit in the
      // page's usual 45px gap under the last paper (which is empty), and the last paper is never covered
      var solidAtEnd = Math.max(0, Math.min(band, 45 - fade));
      var solid = solidAtEnd + (band - solidAtEnd) * t;
      var line = note.querySelector('hr').getBoundingClientRect().top - note.getBoundingClientRect().top;   // where the line sits inside the note
      note.style.setProperty('--top', (line - solid - fade) + 'px');
      note.style.setProperty('--fade', fade + 'px');
    };
    addEventListener('scroll', update, { passive: true }); addEventListener('resize', update); addEventListener('load', update); update();
  })();
</script>

<!--Thank you Claude for this bit below-->
<script>
const MY_NAME = {{ site.publication_name | jsonify }};
const COLLAPSE_THRESHOLD = 12;

function parseAuthors(authorsStr) {
  return authorsStr.split(', ').map(a => {
    const hasDbl = a.includes('**');
    const hasSng = !hasDbl && a.includes('*');
    const name = a.replace(/\*+/g, '').trim();
    return { name, star: hasDbl ? '**' : hasSng ? '*' : null };
  });
}

function formatAuthor(a) {
  const sup = a.star ? `<sup>${a.star}</sup>` : '';
  const nameHtml = a.name === MY_NAME ? `<strong>${a.name}</strong>` : a.name;
  return nameHtml + sup;
}

function getCoGroups(authors) {
  const hasBoth = authors.some(a => a.star === '*') && authors.some(a => a.star === '**');
  let coFirsts, coLasts;
  if (hasBoth) {
    coFirsts = authors.filter(a => a.star === '*');
    coLasts  = authors.filter(a => a.star === '**');
  } else {
    const starred = authors.filter(a => a.star === '*');
    if (starred.length === 0) {
      coFirsts = []; coLasts = [];
    } else {
      const firstBlock = [];
      let i = 0;
      while (i < authors.length && authors[i].star === '*') { firstBlock.push(authors[i]); i++; }
      const lastBlock = [];
      let j = authors.length - 1;
      while (j >= 0 && authors[j].star === '*') { lastBlock.unshift(authors[j]); j--; }
      if (firstBlock.some(a => lastBlock.includes(a))) {
        coFirsts = firstBlock; coLasts = [];
      } else {
        coFirsts = firstBlock; coLasts = lastBlock;
      }
    }
  }
  return { coFirsts, coLasts };
}

function buildCollapsedAuthors(authors) {
  const { coFirsts, coLasts } = getCoGroups(authors);
  const myIdx = authors.findIndex(a => a.name === MY_NAME);

  const showFirst = coFirsts.length > 0 ? coFirsts : [authors[0]];
  const showLast  = coLasts.length  > 0 ? coLasts  : [authors[authors.length - 1]];

  const iAmInFirst = showFirst.some(a => a.name === MY_NAME);
  const iAmInLast  = showLast.some(a => a.name === MY_NAME);

  const lastFirstIdx = Math.max(...showFirst.map(a => authors.indexOf(a)));
  const firstLastIdx = Math.min(...showLast.map(a => authors.indexOf(a)));

  const firstPart = showFirst.map(formatAuthor).join(', ');
  const lastPart  = showLast.map(formatAuthor).join(', ');

  function hasHidden(afterIdx, beforeIdx) {
    return beforeIdx - afterIdx > 1;
  }

  if (iAmInFirst || iAmInLast) {
    const gap = hasHidden(lastFirstIdx, firstLastIdx);
    return gap ? `${firstPart}, \u2026, ${lastPart}` : `${firstPart}, ${lastPart}`;
  } else {
    const mePart   = formatAuthor(authors[myIdx]);
    const leftGap  = hasHidden(lastFirstIdx, myIdx);
    const rightGap = hasHidden(myIdx, firstLastIdx);
    const left  = leftGap  ? `${firstPart}, \u2026, ${mePart}` : `${firstPart}, ${mePart}`;
    const right = rightGap ? `\u2026, ${lastPart}`              : lastPart;
    return `${left}, ${right}`;
  }
}

function buildExpandedAuthors(authors) {
  return authors.map(formatAuthor).join(', ');
}

function renderNotes(p, toggleBtn, abstractBtn) {
  let html = '';
  if (abstractBtn)  html += abstractBtn;
  if (p.paper) {
    const label = p.status === 'review' ? 'preprint' : 'paper';
    html += `<a class="note-link" href="${p.paper}" target="_blank">${label}</a>`;
  }
  if (p.code)       html += `<a class="note-link" href="${p.code}"       target="_blank">code</a>`;
  // if (p.thread)  html += `<a class="note-link" href="${p.thread}"     target="_blank">thread</a>`;
  if (p.cover)      html += `<a class="note-link" href="${p.cover}"      target="_blank">cover</a>`;
  if (p.commentary) html += `<a class="note-link" href="${p.commentary}" target="_blank">commentary</a>`;
  if (p.news)       html += `<a class="note-link" href="${p.news}"       target="_blank">news</a>`;
  if (toggleBtn)    html += toggleBtn;
  return html;
}

function renderEntry(p) {
  const authors = parseAuthors(p.authors);
  const needsCollapse = authors.length > COLLAPSE_THRESHOLD;

  let authorsHtml, toggleBtn = '';

  if (!needsCollapse) {
    authorsHtml = buildExpandedAuthors(authors);
  } else {
    const collapsed = buildCollapsedAuthors(authors);
    const expanded  = buildExpandedAuthors(authors);
    const id = 'auth_' + Math.random().toString(36).slice(2);
    authorsHtml = `<span id="${id}_text">${collapsed}</span>`;
    toggleBtn = `<button type="button" class="note-link" id="${id}_btn" data-state="collapsed" aria-expanded="false"
      data-collapsed="${encodeURIComponent(collapsed)}"
      data-expanded="${encodeURIComponent(expanded)}"
      onclick="toggleAuthors('${id}')">all authors</button>`;
  }

  const yearPart    = p.year ? ` (${p.year}).` : '.';
  const vol         = p.volume ? ` ${p.volume}` : '';
  const pages       = p.pages ? `, ${p.pages}` : '';
  const journalPart = p.journal ? `. <span class="pub-journal">${p.journal}</span>${vol}${pages}` : '';
  let abstractBtn = '', abstractHtml = '';
  if (p.abstract) {
    const aid = 'abs_' + Math.random().toString(36).slice(2);
    abstractBtn  = `<button type="button" class="note-link" id="${aid}_btn" aria-expanded="false" aria-controls="${aid}" onclick="toggleAbstract('${aid}')">abstract</button>`;
    abstractHtml = `<p class="pub-abstract" id="${aid}" hidden>${p.abstract}</p>`;
  }
  const notes = renderNotes(p, toggleBtn, abstractBtn);
  return `<p>${authorsHtml}. <em>${p.title}</em>${journalPart}${yearPart}`
       + (notes ? `<span class="nl-gap"></span> <span class="notes-group">${notes}</span>` : '') + `</p>`
       + abstractHtml;
}

function toggleAbstract(id) {
  const el = document.getElementById(id);
  el.hidden = !el.hidden;
  const btn = document.getElementById(id + '_btn');
  btn.classList.toggle('on', !el.hidden);
  btn.setAttribute('aria-expanded', String(!el.hidden));
}

function toggleAuthors(id) {
  const btn    = document.getElementById(id + '_btn');
  const textEl = document.getElementById(id + '_text');
  if (btn.dataset.state === 'collapsed') {
    textEl.innerHTML  = decodeURIComponent(btn.dataset.expanded);
    btn.textContent   = 'fewer authors';
    btn.dataset.state = 'expanded';
    btn.setAttribute('aria-expanded', 'true');
  } else {
    textEl.innerHTML  = decodeURIComponent(btn.dataset.collapsed);
    btn.textContent   = 'all authors';
    btn.dataset.state = 'collapsed';
    btn.setAttribute('aria-expanded', 'false');
  }
}

// The data is embedded at build time (from _data/publications.json), so the list renders
// before the page is first shown, instead of popping in after a separate download.
const PUBLICATIONS = {{ site.data.publications | jsonify }};

Promise.resolve(PUBLICATIONS)
  .then(pubs => {
    const pubList  = document.getElementById('pubList');
    const prepList = document.getElementById('prepList');
    const subList  = document.getElementById('subList');

    // Split by status: published / review (submitted) / preparation
    const pubPapers  = pubs.filter(p => p.status === 'published').sort((a, b) => b.year - a.year);
    const subPapers  = pubs.filter(p => p.status === 'review');
    const prepPapers = pubs.filter(p => p.status === 'preparation');

    subPapers.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = renderEntry(p);
      subList.appendChild(li);
      document.getElementById('submittedSection').style.display = '';
    });
    subList.setAttribute('start', subPapers.length);
    subList.style.listStyleType = 'decimal';

    pubPapers.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = renderEntry(p);
      pubList.appendChild(li);
      document.getElementById('publishedSection').style.display = '';
    });

    prepPapers.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = renderEntry(p);
      prepList.appendChild(li);
      document.getElementById('preparationSection').style.display = '';
    });

    // Number published list: start at total count, count down
    pubList.setAttribute('start', pubPapers.length);

    // Number prep list separately: start at total count, count down
    prepList.setAttribute('start', prepPapers.length);
    prepList.style.listStyleType = 'decimal';
  })
  .catch(err => console.error("Error rendering publications:", err));
</script>

</div>
