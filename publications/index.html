<script>
const MY_NAME = 'Lyulina AS';
const COLLAPSE_THRESHOLD = 12;

function parseAuthors(authorsStr) {
  return authorsStr.split(', ').map(a => {
    const hasDbl = a.includes('**');
    const hasSng = !hasDbl && a.includes('*');
    const name = a.replace(/\*+/g, '').trim();
    return { name, star: hasDbl ? '**' : hasSng ? '*' : null };
  });
}

function formatAuthor(a) {
  const sup = a.star ? `<sup>${a.star}</sup>` : '';
  const nameHtml = a.name === MY_NAME ? `<strong>${a.name}</strong>` : a.name;
  return nameHtml + sup;
}

function process(text) {
  return text.replace(/\*\*/g, '<sup>**</sup>').replace(/\*/g, '<sup>*</sup>')
             .replace(/Lyulina AS/g, '<strong>Lyulina AS</strong>');
}

function getCoGroups(authors) {
  const hasBoth = authors.some(a => a.star === '*') && authors.some(a => a.star === '**');
  let coFirsts, coLasts;
  if (hasBoth) {
    coFirsts = authors.filter(a => a.star === '*');
    coLasts  = authors.filter(a => a.star === '**');
  } else {
    const starred = authors.filter(a => a.star === '*');
    if (starred.length === 0) {
      coFirsts = []; coLasts = [];
    } else {
      const firstBlock = [];
      let i = 0;
      while (i < authors.length && authors[i].star === '*') { firstBlock.push(authors[i]); i++; }
      const lastBlock = [];
      let j = authors.length - 1;
      while (j >= 0 && authors[j].star === '*') { lastBlock.unshift(authors[j]); j--; }
      if (firstBlock.some(a => lastBlock.includes(a))) {
        coFirsts = firstBlock; coLasts = [];
      } else {
        coFirsts = firstBlock; coLasts = lastBlock;
      }
    }
  }
  return { coFirsts, coLasts };
}

function buildCollapsedAuthors(authors) {
  const { coFirsts, coLasts } = getCoGroups(authors);
  const myIdx = authors.findIndex(a => a.name === MY_NAME);

  const showFirst = coFirsts.length > 0 ? coFirsts : [authors[0]];
  const showLast  = coLasts.length  > 0 ? coLasts  : [authors[authors.length - 1]];

  const iAmInFirst = showFirst.some(a => a.name === MY_NAME);
  const iAmInLast  = showLast.some(a => a.name === MY_NAME);

  const lastFirstIdx = Math.max(...showFirst.map(a => authors.indexOf(a)));
  const firstLastIdx = Math.min(...showLast.map(a => authors.indexOf(a)));

  const firstPart = showFirst.map(formatAuthor).join(', ');
  const lastPart  = showLast.map(formatAuthor).join(', ');

  function hasHidden(afterIdx, beforeIdx) {
    return beforeIdx - afterIdx > 1;
  }

  if (iAmInFirst || iAmInLast) {
    const gap = hasHidden(lastFirstIdx, firstLastIdx);
    return gap ? `${firstPart}, \u2026, ${lastPart}` : `${firstPart}, ${lastPart}`;
  } else {
    const mePart   = formatAuthor(authors[myIdx]);
    const leftGap  = hasHidden(lastFirstIdx, myIdx);
    const rightGap = hasHidden(myIdx, firstLastIdx);
    const left  = leftGap  ? `${firstPart}, \u2026, ${mePart}` : `${firstPart}, ${mePart}`;
    const right = rightGap ? `\u2026, ${lastPart}`              : lastPart;
    return `${left}, ${right}`;
  }
}

function buildExpandedAuthors(authors) {
  return authors.map(formatAuthor).join(', ');
}

function renderNotes(p, toggleBtn) {
  let html = '';
  if (p.paper) {
    const label = p.status === 'review' ? 'preprint' : 'paper';
    html += `<a class="note-link" href="${p.paper}" target="_blank">${label}</a>`;
  }
  if (p.code)       html += `<a class="note-link" href="${p.code}"       target="_blank">code</a>`;
  // if (p.thread)  html += `<a class="note-link" href="${p.thread}"     target="_blank">thread</a>`;
  if (p.cover)      html += `<a class="note-link" href="${p.cover}"      target="_blank">cover</a>`;
  if (p.commentary) html += `<a class="note-link" href="${p.commentary}" target="_blank">commentary</a>`;
  if (p.news)       html += `<a class="note-link" href="${p.news}"       target="_blank">news</a>`;
  if (toggleBtn)    html += toggleBtn;
  if (p.status === 'review') html += `<span style="font-family:'Albra', 'Tiempos', 'Times New Roman', 'Serif'; font-size:0.85em; font-style:italic; color:#333; vertical-align:0.05em;">under review</span>`;
  return html;
}

function renderEntry(p) {
  const authors = parseAuthors(p.authors);
  const needsCollapse = authors.length > COLLAPSE_THRESHOLD;

  let authorsHtml, toggleBtn = '';

  if (!needsCollapse) {
    authorsHtml = buildExpandedAuthors(authors);
  } else {
    const collapsed = buildCollapsedAuthors(authors);
    const expanded  = buildExpandedAuthors(authors);
    const id = 'auth_' + Math.random().toString(36).slice(2);
    authorsHtml = `<span id="${id}_text">${collapsed}</span>`;
    toggleBtn = `<a class="note-link" id="${id}_btn" data-state="collapsed"
      data-collapsed="${encodeURIComponent(collapsed)}"
      data-expanded="${encodeURIComponent(expanded)}"
      onclick="toggleAuthors('${id}')" style="cursor:pointer">all authors</a>`;
  }

  const yearPart = p.year ? ` (${p.year}).` : '.';
  const notes = renderNotes(p, toggleBtn);
  return `<p>${authorsHtml}. <em>${p.title}</em>${yearPart}</p>`
       + (notes ? `<p>${notes}</p>` : '');
}

function toggleAuthors(id) {
  const btn    = document.getElementById(id + '_btn');
  const textEl = document.getElementById(id + '_text');
  if (btn.dataset.state === 'collapsed') {
    textEl.innerHTML  = decodeURIComponent(btn.dataset.expanded);
    btn.textContent   = 'fewer authors';
    btn.dataset.state = 'expanded';
  } else {
    textEl.innerHTML  = decodeURIComponent(btn.dataset.collapsed);
    btn.textContent   = 'all authors';
    btn.dataset.state = 'collapsed';
  }
}

fetch('publications.json')
  .then(response => response.json())
  .then(pubs => {
    const pubList  = document.getElementById('pubList');
    const prepList = document.getElementById('prepList');

    // Papers with a year go to published (includes review); no year goes to prep
    const pubPapers = pubs.filter(p => p.year).sort((a, b) => b.year - a.year);
    const prepPapers = pubs.filter(p => !p.year);

    pubPapers.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = renderEntry(p);
      pubList.appendChild(li);
      document.getElementById('publishedSection').style.display = '';
    });

    prepPapers.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = renderEntry(p);
      prepList.appendChild(li);
      document.getElementById('preparationSection').style.display = '';
    });

    // Number published list: start at total count, count down
    pubList.setAttribute('start', pubPapers.length);

    // Number prep list separately: start at total count, count down
    prepList.setAttribute('start', prepPapers.length);
    prepList.style.listStyleType = 'decimal';
  })
  .catch(err => console.error("Error loading publications.json:", err));
</script>
