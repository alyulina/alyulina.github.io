<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">   <!-- keeps the page out of search results; delete this line to let search engines list it -->
<title>Threading Beads</title>
<style>
  :root { --bg: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  html, body, canvas { cursor: url("/img/cursor_black.png"), auto !important; }   /* the site's normal cursor everywhere */
  #ui { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px;
        font: 13px/1 -apple-system, system-ui, sans-serif; transition: opacity .3s; }
  #ui button { border: 1px solid #ccc; background: #fff; color: #333; padding: 7px 11px;
               border-radius: 6px; cursor: pointer; }
  #ui button:hover { background: #f4f4f4; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui.off { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" class="off">
  <span id="seed" style="align-self:center;color:#999;margin-right:4px"></span>
  <button id="replay">Replay</button>
  <button id="new">New (N)</button>
  <button id="rec">Record video</button>
  <button id="hide" title="Press H to toggle">Hide (H)</button>
</div>
<script>
// ================= tweakables =================
const CFG = {
  nBeads: 20,
  r: 11,                        // bead radius (all the same)
  border: 1.3, borderColor: '#111',

  // palette: every bead gets a different colour (needs at least nBeads entries)
  palette: [
    // yellows (warm, not greenish)
    '#f2c437', '#f7d871', '#fbe8ad', '#e0a52a',
    // peach / orange
    '#f6c391', '#dc8236', '#e5733d',
    // reds / wine
    '#cf4b32', '#a8323a', '#e8907f', '#74264a', '#b8687f',
    // deep blues + lighter
    '#14215a', '#1d3584', '#2c4ea3', '#7f9cd8', '#b9c9ee',
    // bluer purples + lighter
    '#5d63b0', '#8a8fcc', '#b9bce6', '#6c5aa6',
  ],

  jitterRange: [0.6, 1.8],      // beads with less / more room than usual jiggle down to / up to this times `jitter`
  jigSpring: 60, jigDamp: 4.5, jigDampThreaded: 9, jigLively: 0.65,   // the jiggle: spring, damping before / after joining the thread, liveliness
  feelRange: 4.8, repel: 600,   // beads feel neighbours within this many bead radii, and push away this strongly
  jitter: 4.2,                  // px, max twitch offset

  threadColor: '#cdcdcd', threadWidth: 10,
  startWhenSeen: 0.8, pauseWhenSeen: 0.35,   // starts once this much of it is on screen, pauses when less than this is
  designH: 560,                 // px: a frame shorter than this shows the same animation, scaled down to fit
  circle: 0.27,                 // circle radius as a fraction of the shorter window side (bigger = beads further apart)
  // the bead order is optimised for a short thread with gentle turns and few crossings
  turnCost: 85,                 // px of extra thread one would "pay" to avoid a 1-rad² turn
  crossCost: 90,                // px penalty per place where the thread crosses itself
  dropShape: 0.7, dropLength: 1.15,   // curls are drops: 0 = a circle, closer to 1 = a narrower neck and rounder tip; and how long they are
  pickupLead: 50,               // px before the thread's tip arrives that a bead starts to settle
  pickup: 140,                  // px of thread over which a bead eases into riding on it
  soften: [{ at: 'first', from: -120, to: 120, width: 40 }, { at: 'last', from: -40, to: 280, width: 50 }],   // gentler entry/exit bends (px along the thread, smoothing width)
  evenReach: 22, evenRounds: 6, threadRoomWeight: 1.6,   // evening out the spacing: px each bead may slide, rounds, and how much room from other thread counts
  shifts: [{ seed: 2, bead: '#2c4ea3', dx: 0, dy: 16, width: 55 },   // seed 2: the last bead sits lower (a wide, gentle bend)
           { seed: 2, bead: '#f7d871', dx: 6, dy: -6, width: 28 },   // seed 2: the light yellow bead a little up and right
           { seed: 2, bead: '#b9bce6', dx: 18, dy: 0, width: 80 },   // seed 2: the lavender bead a little right, into the gap…
           { seed: 2, bead: '#1d3584', dx: 18, dy: -10, width: 80 }, // …and the navy bead below it right and up (wide, so the turn is spread out)
           { seed: 2, bead: '#14215a', dx: 8, dy: 10, width: 40 }],  // …and down, into a rounder curve
  rawBend: 55,                  // px along the thread over which it is bent to reach a bead's starting spot
  nudges: [{ seed: 2, bead: '#f6c391', along: 14 },    // seed 2: the light peach bead sits a little right of where it was, towards the yellow one
           { seed: 2, bead: '#f7d871', along: 28 },    // seed 2: the light yellow bead sits a little closer to the peach one
           { seed: 2, bead: '#a8323a', along: -18 },   // seed 2: the deep red bead sits just before its turn, so the thread curves on past it
           { seed: 2, bead: '#fbe8ad', along: -16 },   // seed 2: the first bead sits a little further back from the crossing next to it
           { seed: 2, bead: '#e5733d', along: 10 },    // seed 2: the red-orange bead sits midway between the two crossings around it
           { seed: 2, bead: '#2c4ea3', along: 6 }],    // seed 2: the last bead sits a little on from the loop's crossing, not too far from the others
  loopSizes: [28, 38, 50],      // px radii of the curls (small, medium, large), shuffled for each arrangement
  curlClear: 10,                // px of free space a curl needs around it, or it is moved to a nearby bead
  maxLoops: 3,                  // how many curls (placed where the thread runs smoothly with the most room)
  minTurn: 28,                  // px: the tightest turn the thread can make (bigger = smoother, stiffer)
  passWithin: 2.2,              // the thread only has to pass within this many bead radii of a bead to pick it up
  relaxLag: 50, relaxLen: 420,  // px: the thread relaxes into its smooth shape starting this far behind the tip, over this length
  maxPickupMove: 6,             // px: the furthest a bead moves when the thread picks it up
  minBend: 24,                  // px: the tightest bend radius allowed anywhere on the thread
  edgeOffset: 0.12,             // the first/last bead sit up to this far (fraction of radius) above/below the thread's line
  lead: 70,                     // px of straight horizontal thread before the first / after the last bead
  smooth: 10,                   // smoothing passes on the finished thread (higher = rounder bends)
  beadGap: 2,                   // px: a bead is kept at least this far from any other stretch of thread
  swaySpread: 8,                // how far (thread points) a calmed spot spreads along the thread (smaller = more sway inside the circle)
  wiggleGap: 1,                 // px: the smallest gap left between two stretches of thread while they wiggle
  threadedJitter: 0.3,          // fraction of its twitch a bead keeps once it is on the thread
  wiggle: 4.5,                  // px, the "alive" undulation of the thread
  weaveSpeed: 250,              // px of thread per second while weaving

  pullAfterLast: 80,            // px past the last bead the tip gets before the thread starts sliding out (Infinity = only once it is off-screen, then a pause)
  pullAfterLastSmall: 1,        // …and how much further on phones (1 = twice as far), easing in below 900px wide
  pullAccel: 260, pullMax: 460, // px/s², px/s: how the thread slides off to the right
  gravity: 850, bounce: 0.25, bounceRange: [0.2, 0.36], bounceMin: 60, maxBounces: 2, bounceHeights: [6, 22],   // landing: springiness range per bead, and the slowest impact that still bounces (px/s)
  floorGap: 170,                // px below the circle where the invisible line sits
  releaseDelay: [0, 0.3],      // s, a bead hangs on briefly after the thread leaves it

  idle: 0.3, settle: 1.0,  // s  (idle: when the thread starts, while the beads are still appearing)
  popSpan: 4, popDur: 0, popBefore: 0.5,   // s: the beads pop in one by one over popSpan (the thread starts meanwhile), each at least popBefore ahead of the thread; popDur 0 = just appears
  colorByPosition: 0.6,         // 0 = colours follow the thread order, 1 = colours go left → right across the circle
  maxToss: 300, maxRoll: 150,   // px/s: the strongest sideways throw as a bead drops, and how fast it can roll into place
  maxHops: 1,                   // how many times per run a stuck bead may hop over a neighbour (all other stuck pairs swap places)
  maxSwaps: 99,
  hopWait: 1.8,                 // s a bead must be stuck before it hops (last resort)
  hopHeight: 3, hopReach: 99, hopFloat: 0.5, hopPause: 0.8,   // hops over another bead: height (bead radii), max reach, how floaty (lower = slower, gentler), s between hops
  settleBy: 24,                 // s after the thread starts pulling away: by then any bead still jostling eases into place
  rollPull: 9, rollDamp: 5,     // how firmly a landed bead rolls towards its place, and how quickly that settles
  colorSwaps: 3,                // how many small swaps break up the colour order along the thread
  rowSpread: 0.25,              // the final row spreads out towards its ends: outer beads roll further to the side
  rowGap: 3,                    // px between beads in the final row (sorted by colour: yellows → … → blues)
  restHold: 1.5,                // s of resting on the line included at the end of a recorded video
};
// ==============================================

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, zoom = 1, pullFrom = Infinity, landedSent = false, sc, floorY, beads, pts, Lw, phase, pt, t = 0, shift, speed, paused = false;
let rec = null, fallAcc = 0, hopRest = 0, swapsLeft = 0, hopsLeft = 0, fadingIn = true, age = 0;
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(6.2832 * Math.random());

const lerp = (a, b, k) => a + (b - a) * k;
let rng = Math.random;
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rand = (a, b) => a + rng() * (b - a);
// URL options:  ?seed=123  fixed arrangement · ?controls  show the buttons · ?bg=transparent  no background
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get('seed')) || Math.floor(Math.random() * 1e6);
const transparentBg = params.get('bg') === 'transparent';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let visible = false, isStatic = false;
const clamp01 = x => Math.max(0, Math.min(1, x));
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

function resize() {
  DPR = window.devicePixelRatio || 1;
  // a frame shorter than CFG.designH is laid out at full size and drawn scaled down, so small screens
  // get exactly the same beads and movement, only smaller
  // take the size from the frame the page gave it when embedded (iPhone Safari can report a stretched window size
  // inside frames), otherwise from the window; the canvas is set to exactly that size
  const fe = (() => { try { return window.frameElement; } catch (e) { return null; } })();
  const vw = fe && fe.clientWidth ? fe.clientWidth : innerWidth, vh = fe && fe.clientHeight ? fe.clientHeight : innerHeight;
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  zoom = Math.min(1, vh / CFG.designH);
  W = vw / zoom; H = vh / zoom;
  cv.width = Math.round(vw * DPR); cv.height = Math.round(vh * DPR);
  ctx.setTransform(DPR * zoom, 0, 0, DPR * zoom, 0, 0);
  build();
}

function build(noFade) {
  rng = mulberry32(seed);
  document.getElementById('seed').textContent = 'seed ' + seed;
  sc = Math.min(1, Math.min(W, H) / 650);
  const R = Math.min(W, H) * CFG.circle, r = CFG.r * sc, cx = W / 2;
  // keep room above the circle for the biggest outward curl, so it never gets cut off at the top
  const curlRoom = 2 * Math.max(...CFG.loopSizes) * 1.1 * sc + 12 * sc;
  const cy = Math.max(R + curlRoom, (H - (R + CFG.floorGap * sc)) / 2);

  // ---- filled disc of beads (best-candidate sampling: evenly spread, round outline) ----
  const cols = CFG.palette.map(c => [rng(), c]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
  beads = [];
  const n = CFG.nBeads, Rin = R - r;
  for (let i = 0; i < n; i++) {
    let best = null, bestD = -1;
    // the first two beads sit on the thread's line at the left and right edge of the circle,
    // so the thread runs straight into the first one and straight out of the last one
    if (i < 2) {
      const dy = rand(-1, 1) * CFG.edgeOffset * Rin;
      best = { x: cx + (i === 0 ? -1 : 1) * Math.sqrt(Rin * Rin - dy * dy), y: cy + dy };
    }
    for (let k = 0; k < 80 && i > 1; k++) {
      const a = rng() * Math.PI * 2, d = Math.sqrt(rng()) * Rin;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
      const md = Math.min(beads.reduce((m, b) => Math.min(m, Math.hypot(b.x0 - x, b.y0 - y)), Infinity),
                          2 * (Rin - Math.hypot(x - cx, y - cy)) + 2 * r);   // also keep the rim filled
      if (md > bestD) { bestD = md; best = { x, y }; }
    }
    beads.push({ x0: best.x, y0: best.y, r, col: cols[i % cols.length],
                 ox: 0, oy: 0, on: 0, falling: false });
  }
  // ---- choose the bead order: short thread, gentle turns, few self-crossings ----
  // the thread comes in and leaves horizontally, level with the middle of the circle
  const lead = CFG.lead * sc;
  const E = { x0: cx - R - lead, y0: cy }, X = { x0: cx + R + lead, y0: cy };
  const E0 = { x0: E.x0 - 100, y0: cy }, X0 = { x0: X.x0 + 100, y0: cy };   // so turns at E and X count
  const turnAt = (a, b, c) => wrap(Math.atan2(c.y0 - b.y0, c.x0 - b.x0) - Math.atan2(b.y0 - a.y0, b.x0 - a.x0));
  const crosses = (p, q, r2, s2) => {
    const o = (a, b, c) => Math.sign((b.x0 - a.x0) * (c.y0 - a.y0) - (b.y0 - a.y0) * (c.x0 - a.x0));
    return o(p, q, r2) * o(p, q, s2) < 0 && o(r2, s2, p) * o(r2, s2, q) < 0;
  };
  const cost = ord => {
    const q = [E0, E, beads[0], ...ord.map(i => beads[i]), beads[1], X, X0];
    let c = 0;
    for (let i = 1; i < q.length; i++) c += Math.hypot(q[i].x0 - q[i - 1].x0, q[i].y0 - q[i - 1].y0);
    for (let i = 1; i < q.length - 1; i++) c += CFG.turnCost * sc * turnAt(q[i - 1], q[i], q[i + 1]) ** 2;
    for (let i = 0; i < q.length - 1; i++) for (let j = i + 2; j < q.length - 1; j++)
      if (crosses(q[i], q[i + 1], q[j], q[j + 1])) c += CFG.crossCost * sc;
    return c;
  };
  let bestOrd = null, bestC = Infinity;
  for (let start = 0; start < 4; start++) {
    let ord = [...beads.keys()].slice(2);   // the two edge beads stay first and last
    if (start === 0) ord.sort((a, b) => beads[a].x0 - beads[b].x0);
    else ord.sort(() => rng() - 0.5);
    let c = cost(ord);
    for (let it = 0; it < 6000; it++) {
      const i = Math.floor(rng() * ord.length), j = Math.floor(rng() * ord.length);
      if (i === j) continue;
      const nw = [...ord];
      if (rng() < 0.5) {                       // reverse a stretch (2-opt)
        const [a, b] = i < j ? [i, j] : [j, i];
        nw.splice(a, b - a + 1, ...ord.slice(a, b + 1).reverse());
      } else {                                 // move one bead elsewhere
        const [m] = nw.splice(i, 1); nw.splice(j, 0, m);
      }
      const nc = cost(nw);
      if (nc < c) { ord = nw; c = nc; }
    }
    if (c < bestC) { bestC = c; bestOrd = ord; }
  }
  beads = [beads[0], ...bestOrd.map(i => beads[i]), beads[1]];
  // deal the colours out along the thread in (mostly) sorted order, so it picks them up as a loose gradient
  {
    // blend of left→right position and thread order: the thread still meets the colours mostly in order,
    // and each bead's place in the final row ends up roughly below where it falls from
    const cs = beads.map(b => b.col).sort(colorCmp);
    for (let k = 0; k < CFG.colorSwaps; k++) {   // a few small swaps so it is only *mostly* in order
      const i = Math.floor(rng() * (cs.length - 1)), j = Math.min(cs.length - 1, i + 1 + Math.floor(rng() * 2));
      [cs[i], cs[j]] = [cs[j], cs[i]];
    }
    const xRank = new Map([...beads].sort((a, b) => a.x0 - b.x0).map((b, i) => [b, i]));
    const byKey = beads.map((b, i) => [CFG.colorByPosition * xRank.get(b) + (1 - CFG.colorByPosition) * i, b]).sort((a, b) => a[0] - b[0]);
    byKey.forEach(([, b], i) => b.col = cs[i]);
  }
  beads.forEach(b => { b.ix = b.x0; b.iy = b.y0; });   // where each bead starts
  // a few round curls, placed at beads where the thread runs smoothly with room on both sides
  const seq = [E, ...beads, X];
  beads.forEach((b, i) => {
    b.turn = turnAt(seq[i], b, seq[i + 2]);
  });
  // spread the curls out: one near the start of the thread and one near its end, both on the outer edge
  // (windows of ~6 beads: the first one at the start of the thread, the last one at its end, others evenly between)
  const win = Math.min(6, beads.length - 2), m = CFG.maxLoops;
  for (let part = 0; part < m; part++) {
    const lo = 1 + (m === 1 ? Math.floor((beads.length - 2 - win) / 2) : Math.round(part * (beads.length - 2 - win) / (m - 1))), hi = lo + win;
    // only beads on the outer edge of the circle, where the thread runs along the edge (so the curl can point outward)
    const score = b => {
      const i = beads.indexOf(b), pv = seq[i], nx = seq[i + 2];
      let tx = nx.x0 - pv.x0, ty = nx.y0 - pv.y0; const tn = Math.hypot(tx, ty) || 1; tx /= tn; ty /= tn;
      const rr = Math.hypot(b.x0 - cx, b.y0 - cy) || 1, along = 1 - Math.abs(tx * (b.x0 - cx) / rr + ty * (b.y0 - cy) / rr);
      return (rr / Rin) * 2 + along;
    };
    const cand = beads.slice(lo, hi)
      .filter(b => Math.hypot(b.x0 - cx, b.y0 - cy) > 0.7 * Rin)
      .filter(b => beads.every(o => !o.loop || Math.hypot(o.x0 - b.x0, o.y0 - b.y0) > 0.8 * R))   // curls well apart
      .sort((a, b) => score(b) - score(a));
    if (cand[0]) cand[0].loop = true;
  }
  // if a stretch had no bead on the edge, take the best remaining edge bead anywhere (still kept apart)
  for (let k = beads.filter(b => b.loop).length; k < CFG.maxLoops; k++) {
    const seqI = b => beads.indexOf(b);
    const pick = beads.slice(1, -1)
      .filter(b => !b.loop && Math.hypot(b.x0 - cx, b.y0 - cy) > 0.7 * Rin)
      .filter(b => beads.every(o => !o.loop || Math.hypot(o.x0 - b.x0, o.y0 - b.y0) > 0.8 * R))
      .sort((a, b) => Math.hypot(b.x0 - cx, b.y0 - cy) - Math.hypot(a.x0 - cx, a.y0 - cy))[0];
    if (!pick) break;
    pick.loop = true;
  }
  // give the curls different sizes
  {
    const sizes = CFG.loopSizes.map(v => [rng(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
    beads.filter(b => b.loop).forEach((b, k) => b.loopSize = sizes[k % sizes.length] * rand(0.9, 1.1));
  }
  // ---- the thread: a "pen" that cannot turn tighter than minTurn, so it never kinks ----
  // It aims at each bead in turn and only has to pass close by; once the tip has gone past,
  // the bead slides the short distance onto the thread (the thread "relaxing" around it).
  const ds = 2, kMax = 1 / (CFG.minTurn * sc), hitR = CFG.passWithin * r;
  let x, y, th;
  const move = k => { th += k * ds; x += Math.cos(th) * ds; y += Math.sin(th) * ds; pts.push({ x, y }); };
  const steer = (tx, ty) => move(Math.max(-kMax, Math.min(kMax, wrap(Math.atan2(ty - y, tx - x) - th) * 0.05 / sc)));
  const seek = (tx, ty) => {
    let minD = Infinity, minI = pts.length - 1;
    for (let s = 0; s < 2500; s++) {
      const d = Math.hypot(tx - x, ty - y);
      if (d < minD) { minD = d; minI = pts.length - 1; }
      const behind = Math.cos(th) * (tx - x) + Math.sin(th) * (ty - y) < 0;
      if (d < 1.5 || (behind && minD < hitR)) break;        // passed through or close by
      if (behind && minD < 3 * hitR && d > minD + 6) break;  // went past a bit wide: don't circle back for it
      steer(tx, ty);
    }
    return minI;
  };
  // a drop-shaped curl: gentle at the neck, rounder at the tip, turning a full turn in all;
  // the tip is never tighter than minTurn. Returns the curvature for each step.
  // (gentle where it leaves and rejoins, round at the tip, so the thread crosses itself at the neck: a teardrop)
  const dropKs = rho => {
    const a = CFG.dropShape, kMaxTip = 1 / (CFG.minTurn * sc);
    const L = Math.max(2 * Math.PI * rho * CFG.dropLength, (1 + a) * 2 * Math.PI / kMaxTip);
    const steps = Math.round(L / ds), kAvg = 2 * Math.PI / (steps * ds);
    return Array.from({ length: steps }, (_, s) => kAvg * (1 - a * Math.cos(2 * Math.PI * (s + 0.5) / steps)));
  };
  const runPen = () => {
    x = -120; y = cy; th = 0; pts = [{ x, y }];
    while (x < E.x0) move(0);   // straight, horizontal entry
    beads.forEach(b => {
      b.idx = seek(b.x0, b.y0);
      if (b.loop) {   // a round curl, curling outward, away from the middle of the circle
        const side = (-Math.sin(th) * (x - cx) + Math.cos(th) * (y - cy)) >= 0 ? 1 : -1, rho = Math.max(CFG.minTurn, b.loopSize) * sc;
        b.rho = rho;
        b.loopFrom = pts.length;
        b.dropKs = dropKs(rho);
        for (const k of b.dropKs) move(side * k);
        b.loopTo = pts.length;
        // centre and size of the drop, for the "does it have room" check
        const lp = pts.slice(b.loopFrom, b.loopTo), mx = lp.reduce((s, p) => s + p.x, 0) / lp.length, my = lp.reduce((s, p) => s + p.y, 0) / lp.length;
        b.loopC = { x: mx, y: my }; b.rho = lp.reduce((s, p) => s + Math.hypot(p.x - mx, p.y - my), 0) / lp.length;
      }
    });
    // exit: ease back onto the horizontal line y = cy and run out straight
    for (let s = 0; s < 4000 && x < W + 120; s++) steer(x + lead, cy);
  };
  // how much free space a curl centred at c with radius rho has (from the rest of the thread and the other beads)
  const clearance = (c, rho, owner, from, to) => {
    let m = Infinity;
    for (let i = 0; i < pts.length; i += 2) {
      if (i >= from - 30 && i <= to + 30) continue;   // its own curl and where it joins the thread
      m = Math.min(m, Math.hypot(pts[i].x - c.x, pts[i].y - c.y) - rho);
    }
    beads.forEach(o => { if (o !== owner) m = Math.min(m, Math.hypot(o.x0 - c.x, o.y0 - c.y) - rho - r); });
    return m;
  };
  // where a curl would go if it were placed at bead b on the current thread

      const p = pathAt(b.u), w = wig(b.u) * b.on * p.amp, j = 1 - (1 - CFG.threadedJitter) * b.on;   // keeps a little twitch once threaded
      const e = relaxAt(b.u);   // carried along as the thread relaxes
      // once on the thread, the jiggle that would push a bead off its centre line fades fast; it may still shimmy along it
      const along = b.ox * p.tx + b.oy * p.ty, across = -b.ox * p.ty + b.oy * p.tx, off = Math.pow(1 - b.on, 2);
      b.x = lerp(b.ix, b.hx, e) - p.ty * w + p.tx * along * j - p.ty * across * off;
      b.y = lerp(b.iy, b.hy, e) + p.tx * w + p.ty * along * j + p.tx * across * off;
    }
  }
  // ---- fallen beads: real 2-D physics on the line. They fall with a gentle toss, then roll towards their
  //      colour-sorted place; they never overlap: they bump, push and climb over each other (flat, no depth) ----
  const fallen = beads.filter(b => b.falling), H = 1 / 120;
  const easeIn = phase === 'pull' && pt > CFG.settleBy;
  let hopper = fallen.find(b => b.hopping) || null;
  if (!hopper) hopRest = Math.max(0, hopRest - dt);   // safety net: if anything is still jostling, ease it into place
  if (phase === 'pull' || phase === 'rest') {
    fallAcc += dt;
    while (fallAcc >= H) {
      fallAcc -= H;
      for (const b of fallen) {
        const ground = floorY - b.r, onFloor = b.y >= ground - 0.5;
        const supported = onFloor || b.touching;
        b.hopCool = (b.hopCool || 0) - H;
        if (supported) {   // roll towards its place: a soft spring with damping, and a speed limit
          b.vx += (CFG.rollPull * (b.slotX - b.x) - CFG.rollDamp * b.vx) * H;
          b.vx = Math.max(-CFG.maxRoll * sc, Math.min(CFG.maxRoll * sc, b.vx));
          // stuck on top of others, or another bead is in the way: hop over, straight onto its own place.
          // Only one bead hops at a time, so they take turns instead of blocking each other.
          const dir = Math.sign(b.slotX - b.x), ground = floorY - b.r, raised = b.y < ground - 2;
          const blocked = dir && fallen.some(o => o !== b && Math.abs(o.y - b.y) < b.r && (o.x - b.x) * dir > 0 && Math.abs(o.x - b.x) < 2 * b.r + 2);
          // it has to have been stuck for a while first: no hopping straight after landing
          b.stuck = (raised || blocked) && Math.abs(b.vx) < 25 * sc && Math.abs(b.vy) < 30 * sc ? (b.stuck || 0) + H : 0;
          // on the line and blocked by a neighbour that needs to get past it the other way: they swap places in the row
          // instead of hopping (only neighbours swap, so the row stays almost exactly in colour order)
          // one stuck bead per run may hop over its neighbour; any other stuck pair just swaps places in the row
          // (so the colours may end up slightly out of order)
          if (!raised && blocked && b.stuck > CFG.hopWait * 0.5 && (hopsLeft <= 0 || hopper || hopRest > 0)) {
            const o = fallen.find(o2 => o2 !== b && Math.abs(o2.y - b.y) < b.r && (o2.x - b.x) * dir > 0 && Math.abs(o2.x - b.x) < 2 * b.r + 2);
            if (o && (o.slotX - o.x) * dir < 0) { const t2 = o.slotX; o.slotX = b.slotX; b.slotX = t2; b.stuck = 0; o.stuck = 0; swapsLeft--; }
          }
          // stuck on top of others once the hop is used up: roll off sideways towards its place instead
          if (raised && hopsLeft <= 0 && b.stuck > CFG.hopWait) { b.vx = dir * 0.8 * CFG.maxRoll * sc; b.stuck = 0; }
          // once the swaps are used up, a bead still stuck on the line hops over instead (one gentle hop)
          if (hopsLeft > 0 && Math.abs(b.slotX - b.x) > 2 && b.stuck > CFG.hopWait && b.hopCool <= 0 && !hopper && hopRest <= 0) {
            // a small hop: just high enough to clear the bead in the way, and not too far at once
            const g = CFG.gravity * CFG.hopFloat, up = Math.sqrt(2 * g * CFG.hopHeight * b.r), drop = ground - b.y;
            const tFly = (up + Math.sqrt(up * up + 2 * g * Math.max(0, drop))) / g;
            const dx = Math.max(-CFG.hopReach * b.r, Math.min(CFG.hopReach * b.r, b.slotX - b.x));
            b.vy = -up; b.vx = dx / tFly; b.hopCool = 0.6; b.hopping = true; b.hopped = true; hopper = b; hopRest = CFG.hopPause; hopsLeft--;
          }
        }
        b.vy += CFG.gravity * (b.hopping ? CFG.hopFloat : 1) * H;   // hops are floatier
        b.x += b.vx * H; b.y += b.vy * H;
        if (b.hopping && b.vy > 0 && (b.y >= floorY - b.r - 0.5 || b.touching)) { b.hopping = false; if (hopper === b) hopper = null; }
        if (easeIn) b.x += (b.slotX - b.x) * Math.min(1, H * 3);
        b.touching = false;
      }
      for (let it = 0; it < 4; it++) {
        if (!easeIn) for (let i = 0; i < fallen.length; i++) for (let k = i + 1; k < fallen.length; k++) {
          const a = fallen[i], c = fallen[k], dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy), m = a.r + c.r;
          if (d >= m || d < 1e-6) continue;
          const nx = dx / d, ny = dy / d, o = (m - d) / 2;
          a.x -= nx * o; a.y -= ny * o; c.x += nx * o; c.y += ny * o;
          const vn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
          if (vn < 0) { const jv = -(1 + 0.1) * vn / 2; a.vx -= jv * nx; a.vy -= jv * ny; c.vx += jv * nx; c.vy += jv * ny; }
          if (ny > 0.3) a.touching = true; if (ny < -0.3) c.touching = true;   // resting on a bead below
        }
        for (const b of fallen) {
          const ground = floorY - b.r;
          if (b.y > ground || (b.touching && b.y > ground - 2.2 * b.r)) b.landed = true;   // down on the line (or on a bead on it)
          if (b.y > ground) {   // all land on the same line; only the first landing bounces (a couple of small bounces)
            b.y = ground;
            if (b.vy > CFG.bounceMin * sc && (b.nBounce || 0) < CFG.maxBounces && !b.hopped) { b.vy = -Math.min(b.vy * (b.bounce ?? CFG.bounce), Math.sqrt(2 * CFG.gravity * (b.bounceMax ?? 20) * sc)); b.nBounce = (b.nBounce || 0) + 1; }
            else { b.vy = 0; if (b.nBounce) b.nBounce = CFG.maxBounces; }
          }
          const lo = b.r + 8 * sc, hi = W - b.r - 8 * sc;   // never off the page
          if (b.x < lo) { b.x = lo; b.vx = Math.abs(b.vx) * 0.3; }
          if (b.x > hi) { b.x = hi; b.vx = -Math.abs(b.vx) * 0.3; }
        }
      }
    }
  }
  // once every bead is down, tell the page (it brings the text in while they finish bouncing and rolling into place)
  if (!landedSent && !isStatic && fallen.length === beads.length && fallen.every(b => b.landed)) {
    landedSent = true;
    if (parent !== window) parent.postMessage({ type: 'beads:landed', floorY: floorY * zoom, r: CFG.r * sc * zoom }, '*');
  }
  if (phase === 'pull' && tail > Lw + 20 && fallen.length === beads.length &&
      fallen.every(b => b.y >= floorY - b.r - 0.5 && Math.abs(b.x - b.slotX) < 0.6 && Math.abs(b.vx) < 3 && Math.abs(b.vy) < 3)) {
    fallen.forEach(b => { b.x = b.slotX; b.y = floorY - b.r; b.vx = b.vy = 0; });
    toRest();
  }
  if (phase === 'rest' && rec && rec.state === 'recording' && pt > CFG.restHold) rec.stop();
  return { head, tail };
}

function draw(s) {
  if (!s) return;
  if (transparentBg) ctx.clearRect(0, 0, W, H); else { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;
  const tw = CFG.threadWidth * sc;

  // thread
  if (s.head > s.tail) {
    ctx.strokeStyle = CFG.threadColor; ctx.lineWidth = tw;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    let p = threadAt(s.tail); ctx.moveTo(p.x, p.y);
    for (let u = s.tail + 3; u < s.head; u += 3) { p = threadAt(u); ctx.lineTo(p.x, p.y); }
    p = threadAt(s.head); ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  // beads
  for (const b of beads) {
    // at the start the beads appear one after another, in random order (full size, no growing)
    let k = 1;
    if (fadingIn && age < CFG.popSpan + 0.1) k = CFG.popDur > 0 ? clamp01((age - (b.popAt || 0)) / CFG.popDur) : (age >= (b.popAt || 0) ? 1 : 0);
    if (k <= 0) continue;
    ctx.globalAlpha = k * k * (3 - 2 * k);
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.col; ctx.fill();
    ctx.lineWidth = CFG.border; ctx.strokeStyle = CFG.borderColor; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (!paused && visible && !isStatic) draw(step(dt));
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const ui = document.getElementById('ui');
if (params.has('controls')) ui.classList.remove('off');
if (transparentBg) document.documentElement.style.setProperty('--bg', 'transparent');
document.getElementById('replay').onclick = e => { e.stopPropagation(); build(); };
document.getElementById('hide').onclick = e => { e.stopPropagation(); ui.classList.add('hidden'); };
// replays only from the page's replay button (or R / the Replay control when opened on its own)
const newSeed = () => { seed = Math.floor(Math.random() * 1e6); history.replaceState(null, '', '?seed=' + seed); build(); };
document.getElementById('new').onclick = e => { e.stopPropagation(); newSeed(); };
addEventListener('keydown', e => {
  if (e.key === ' ') { paused = !paused; e.preventDefault(); }
  if (e.key === 'h' || e.key === 'H') ui.classList.toggle('hidden');
  if (e.key === 'r' || e.key === 'R') build();
  if (e.key === 'n' || e.key === 'N') newSeed();
});
// record one full run as a video
const recBtn = document.getElementById('rec');
function startRecording() {
  rec = new MediaRecorder(cv.captureStream(60), { mimeType: 'video/webm', videoBitsPerSecond: 8e6 });
  const chunks = []; rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'threading-beads-seed' + seed + '.webm'; a.click();
    recBtn.textContent = 'Record video'; rec = null;
  };
  rec.start(); recBtn.textContent = 'Recording…';
}
recBtn.onclick = e => {
  e.stopPropagation();
  if (!cv.captureStream || !window.MediaRecorder) { alert('Recording not supported in this browser.'); return; }
  if (rec) return;
  build(); startRecording();   // one full run, from the fade-in until the beads rest on the line
};

// reduced motion: no animation, just the beads already resting in their row
function showStill() { isStatic = true; settleNow(); }
// …unless the viewer asks to see it (the page's play button)
function playOnce() { isStatic = false; started = true; build(); }   // (started: play right away, it was asked for)
// a resize restarts the animation, unless the beads have already landed: then they are just redrawn in their row
// (the page beside it can change width when its text appears and a scrollbar comes in)
function settleNow() { build(true); for (let n = 0; phase !== 'rest' && n < 20000; n++) step(1 / 60); if (phase !== 'rest') toRest(); draw(step(0)); }
addEventListener('resize', () => {
  const wasResting = phase === 'rest';
  resize();
  if (reducedMotion && isStatic) showStill(); else if (wasResting) settleNow();
});
resize();
if (reducedMotion) { visible = true; showStill(); }
// start only once most of it has scrolled into view (so the whole fall can be seen), then pause while it is
// mostly off-screen
let ioRatio = 0, started = false;
const setVisible = v => { if (v && !visible) last = performance.now(); visible = v; };
const checkView = () => {
  const r = Math.max(ioRatio, parentRatio());
  if (r >= CFG.startWhenSeen) started = true;
  setVisible(started && r >= CFG.pauseWhenSeen);
};
new IntersectionObserver(es => { ioRatio = es[0].intersectionRatio; checkView(); },
                         { threshold: [0, CFG.pauseWhenSeen, CFG.startWhenSeen, 1] }).observe(cv);
// backup check (the observer above can miss updates): when embedded on the same site, look at how much of the
// frame is inside the window; when opened on its own, it is all in view
function parentRatio() {
  try {
    const fe = window.frameElement;
    if (!fe) return parent === window ? 1 : 0;
    const r = fe.getBoundingClientRect(), vh = parent.innerHeight;
    return Math.max(0, Math.min(r.bottom, vh) - Math.max(r.top, 0)) / (r.height || 1);
  } catch (e) { return 0; }
}
setInterval(checkView, 300);
requestAnimationFrame(frame);
</script>
</body>
