		<script>
  // Before MathJax runs, move punctuation that directly follows an equation ("$x$," or "$x$.")
  // inside it, so the comma or period can never wrap onto the next line on its own.
  function gluePunctuationIntoMath(root) {
    // A centered paragraph holding a single $...$ is a display equation: typeset it as one,
    // so that on narrow screens MathJax breaks it at = or ≈ rather than wherever the line ends.
    root.querySelectorAll('p').forEach(function (p) {
      if (p.style.textAlign !== 'center' || p.childNodes.length !== 1 || p.firstChild.nodeType !== 3) return;
      var m = p.firstChild.data.match(/^\s*\$([^$]+)\$\s*([.,;:!?]*)\s*$/);
      if (m) p.firstChild.data = '\\[' + unwrapDisplaystyle(m[1]) + m[2] + '\\]';
    });
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var tag = n.parentNode && n.parentNode.nodeName;
        return (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || tag === 'PRE')
          ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      var parts = n.data.split('$');
      // Only touch text with whole $...$ pairs and no $$ or escaped \$.
      if (parts.length < 3 || parts.length % 2 === 0 || /\$\$|\\\$/.test(n.data)) return;
      for (var i = 1; i < parts.length; i += 2) {
        parts[i] = unwrapDisplaystyle(parts[i]);
        var m = parts[i + 1].match(/^[.,;:!?]+/);
        if (m) { parts[i] += m[0]; parts[i + 1] = parts[i + 1].slice(m[0].length); }
        // A short equation (like N=10^3) is kept in one piece, so on a phone it moves to the next line whole
        // instead of splitting at its = sign; long ones (or any that would not fit on a line at this text size)
        // may still break, so they never run off the screen.
        if (fitsOnALine(parts[i], n.parentNode)) parts[i] = '{' + parts[i] + '}';
      }
      n.data = parts.join('$');
    });
  }

  // Whether an equation is short, and would fit on one line here: it counts about how many symbols it shows
  // (each \command as one; braces, ^, _ and spaces as none), each about 0.65 of the text size wide (measured: about 0.6).
  function fitsOnALine(tex, el) {
    var shown = tex.replace(/\\[a-zA-Z]+/g, '#').replace(/\\./g, '#').replace(/[{}^_\s]/g, '').length;
    if (shown > 16) return false;
    var block = el && el.closest ? (el.closest('p, li, div') || el) : null;
    if (!block || !block.clientWidth) return true;
    var size = parseFloat(getComputedStyle(block).fontSize) || 16;
    return shown * 0.65 * size <= block.clientWidth;
  }

  // "\displaystyle{ ... }" makes the whole equation one unbreakable group; since
  // \displaystyle already applies to the rest of the formula, drop the braces.
  function unwrapDisplaystyle(tex) {
    var m = tex.match(/^(\s*\\displaystyle\s*)\{/);
    if (!m) return tex;
    var depth = 0, start = m[0].length - 1;
    for (var j = start; j < tex.length; j++) {
      var ch = tex[j];
      if (ch === '\\') { j++; continue; }
      if (ch === '{') depth++;
      else if (ch === '}' && --depth === 0) {
        return m[1].replace(/\s*$/, ' ') + tex.slice(start + 1, j) + ' ' + tex.slice(j + 1);
      }
    }
    return tex;
  }

  MathJax = {
    loader: {
      // MathJax and its font are served from this site (mathjax/),
      // so pages make no requests to outside servers.
      paths: { fonts: '/mathjax/fonts' }
    },
    options: {
      // Keep equations static: no interactive explorer (highlighting, keyboard navigation and its
      // help window), no right-click menu and no Tab stops. Screen readers get hidden MathML
      // instead, which they read directly.
      enableMenu: false,
      menuOptions: { settings: { enrich: false, assistiveMml: true, inTabOrder: false } }
    },
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    output: {
      // Break equations that are wider than the text column (in practice, only on phones).
      displayOverflow: 'linebreak',
      linebreaks: { inline: true, width: '100%', lineleading: 0.2 }
    },
    startup: {
      ready: function () {
        gluePunctuationIntoMath(document.body);
        MathJax.startup.defaultReady();
      }
    }
  };
</script>
<script async src="/mathjax/tex-mml-chtml.js"></script>

		<body>
			<header class="site-header">   <!-- the name and the menu: pinned to the top while scrolling, except on phones -->
				<div class="blurb">
					<h1>{{ site.name }}</h1>
				</div>
				{% include nav.html %}
			</header>
<script>
  // while the header is pinned, links to a footnote or a section stop just below it instead of underneath it
  (function () {
    var h = document.querySelector('.site-header');
    if (!h) return;
    var set = function () { var cs = getComputedStyle(h); document.documentElement.style.scrollPaddingTop = cs.position === 'sticky' ? ((parseFloat(cs.top) || 0) + h.offsetHeight + (parseFloat(cs.getPropertyValue('--fade')) || 0) + 8) + 'px' : ''; };   // (below the header and its fade)
    // the fade under the header grows in over the first 30px of scrolling, so at the top of a page nothing is dimmed
    var fade = function () { var f = parseFloat(getComputedStyle(h).getPropertyValue('--fade')) || 0; h.style.setProperty('--fade-now', f * Math.min(1, Math.max(0, scrollY) / 30) + 'px'); };
    set(); fade(); addEventListener('resize', function () { set(); fade(); }); addEventListener('load', set); addEventListener('scroll', fade, { passive: true });
    if (document.fonts) document.fonts.ready.then(set);   // (again once the fonts are in: a downloaded serif for the name can change the header's height)
  })();
</script>
			<div class="container">
				{{ content }}
			</div>
		</body>
