<script>
  // the bacterium at the end of the menu switches the bacteria cursor on and off, and the browser remembers it
  (function () {
    var b = document.querySelector('.cursor-switch button'), html = document.documentElement;
    if (!b) return;
    b.setAttribute('aria-pressed', html.classList.contains('bacteria-cursor'));
    b.onclick = function () {
      var on = !html.classList.contains('bacteria-cursor');
      html.classList.toggle('bacteria-cursor', on); b.setAttribute('aria-pressed', on);
      try { if (on) localStorage.setItem('cursor', 'bacteria'); else localStorage.removeItem('cursor'); } catch (e) {}
    };
  })();
</script>
